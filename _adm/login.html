<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Painel Convites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #0b0c10; --bg-surface: #14161d; --bg-elevated: #1d202b;
    --text-primary: #f6f6f8; --text-secondary: #a0a4b8; --text-muted: #696c7e;
    --accent-gold: #e5b869; --accent-gold-hover: #f3c77d;
    --border-color: rgba(255,255,255,0.08); --border-gold: rgba(229,184,105,0.3);
    --danger: #e06c5a;
    --radius-md: 16px; --radius-lg: 24px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg-primary); color: var(--text-primary); font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 40px 32px; width: 100%; max-width: 380px; text-align: center; }
  .logo { font-size: 40px; margin-bottom: 8px; display: block; }
  h1 { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 600; margin-bottom: 6px; }
  .sub { color: var(--text-secondary); font-size: 13px; margin-bottom: 28px; }
  .field { text-align: left; margin-bottom: 20px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
  .field input { width: 100%; background: var(--bg-elevated); border: 1px solid var(--border-color); color: var(--text-primary); padding: 12px 14px; border-radius: 10px; font-size: 14px; outline: none; transition: border-color .2s; }
  .field input:focus { border-color: var(--border-gold); }
  .btn { width: 100%; background: var(--accent-gold); color: #14161d; border: none; padding: 13px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; transition: background .2s; }
  .btn:hover { background: var(--accent-gold-hover); }
  .error { color: var(--danger); font-size: 13px; margin-top: 14px; min-height: 18px; }
  .hint { margin-top: 22px; color: var(--text-muted); font-size: 11px; line-height: 1.6; }
</style>
</head>
<body>
  <div class="login-card">
    <span class="logo">✦</span>
    <h1>Painel Convites</h1>
    <p class="sub">Acesso restrito — somente Thiago</p>
    <form id="loginForm">
      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite a senha" autocomplete="current-password" autofocus required>
      </div>
      <button type="submit" class="btn">Entrar</button>
      <div class="error" id="errorMsg"></div>
    </form>
    <div class="hint">Área interna de briefing, preços e demos.<br>Não faz parte do site público.</div>
  </div>

  <script>
    // Carrega o sha256 puro do auth.js (que não redireciona em login.html)
    (function () {
      var s = document.createElement('script');
      s.src = 'auth.js';
      s.onload = function () {
        window.__loginReady = true;
      };
      document.head.appendChild(s);
    })();

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var err = document.getElementById('errorMsg');
      var senha = document.getElementById('senha').value;

      var check = function () {
        var hash = window.__auth.sha256(senha);
        if (hash === window.__auth.PASS_HASH) {
          sessionStorage.setItem(window.__auth.TOKEN_KEY, hash);
          var target = new URLSearchParams(location.search).get('target');
          var dest = target && target !== '/' ? decodeURIComponent(target) : 'index.html';
          // Evita open redirect para fora
          if (!dest || dest.indexOf('http') === 0) { dest = 'index.html'; }
          location.href = dest;
        } else {
          err.textContent = 'Senha incorreta. Tente novamente.';
        }
      };

      if (window.__auth && window.__auth.sha256) {
        check();
      } else {
        setTimeout(check, 300);
      }
    });
  </script>
</body>
</html>
